[program:clickhouse]
command=/usr/bin/clickhouse-server --config-file=/etc/clickhouse-server/config.xml
user=clickhouse
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/flowvision/clickhouse.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=2
stderr_logfile=/var/log/flowvision/clickhouse-err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=2

[program:telegraf]
command=/usr/local/bin/telegraf --config /etc/telegraf/telegraf.conf
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/flowvision/telegraf.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=2
stderr_logfile=/var/log/flowvision/telegraf-err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=2

[program:nextjs]
command=/usr/local/bin/node /app/web/server.js
directory=/app/web
autostart=true
autorestart=true
priority=30
environment=NODE_ENV="production",PORT="3000",HOSTNAME="0.0.0.0",CLICKHOUSE_HOST="http://localhost:8123"
stdout_logfile=/var/log/flowvision/nextjs.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=2
stderr_logfile=/var/log/flowvision/nextjs-err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=2
