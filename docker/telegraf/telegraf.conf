[agent]
  interval = "5s"
  flush_interval = "5s"
  omit_hostname = true

[[inputs.netflow]]
  service_address = "udp://:2055"
  protocol = "netflow v9"

[[processors.starlark]]
  source = '''
def apply(metric):
    # NetFlow v9 field names (confirmed via Telegraf plugin docs/source and
    # live capture against a real OPNsense ng_netflow v9 exporter):
    # protocol = "tcp" / "udp" / "icmp" (string) -- same name/type as v5
    # src / dst = IP addresses (string)
    # src_port / dst_port = port numbers (uint)
    # in_bytes = IN_BYTES (field 1), bytes transferred INTO the observation point (uint)
    # in_packets = IN_PKTS (field 2), packets transferred INTO the observation point (uint)
    #
    # NOTE: OPNsense's ng_netflow exporter hardcodes OUT_BYTES (field 23) and
    # OUT_PKTS (field 24) to 0 and places them after IN_BYTES/IN_PKTS in the
    # template. Telegraf's netflow v9 decoder maps each NetFlow field ID to
    # its OWN distinct output field name (in_bytes vs out_bytes, in_packets
    # vs out_packets) rather than a shared generic "bytes"/"packets" field,
    # so there is NO last-field-wins collision here -- confirmed both by the
    # plugin's field-mapping design (one field name per Cisco/IANA field ID)
    # and by a live decode capture below. We deliberately read in_bytes /
    # in_packets ONLY and never touch out_bytes / out_packets, both as
    # defense in depth and because those are the values that are actually
    # meaningful for this exporter.

    src_ip = metric.fields.get("src", "")
    dst_ip = metric.fields.get("dst", "")

    # Skip non-flow metrics (e.g. heartbeat entries without IP)
    if src_ip == "" and dst_ip == "":
        return None

    in_bytes = metric.fields.get("in_bytes", metric.fields.get("bytes", 0))
    in_packets = metric.fields.get("in_packets", metric.fields.get("packets", 0))
    src_port = metric.fields.get("src_port", 0)
    dst_port = metric.fields.get("dst_port", 0)

    # protocol comes as string "tcp", "udp", "icmp" - convert to IANA number
    proto_str = metric.fields.get("protocol", "")
    
    # Debug: log when protocol string is NOT udp (to catch TCP/other entries)
    if proto_str != "udp" and proto_str != "":
        print("NON-UDP proto:", proto_str, "src:", src_ip, "dst:", dst_ip, "dport:", dst_port)
    
    if proto_str == "tcp":
        protocol = 6
    elif proto_str == "udp":
        protocol = 17
    elif proto_str == "icmp":
        protocol = 1
    else:
        # Could be integer (some routers send raw IANA numbers)
        p = int(metric.fields.get("protocol", 0))
        protocol = p

    timestamp_ms = int(metric.time / 1000000)

    metric.tags.clear()
    metric.fields.clear()

    metric.tags["timestamp"] = str(timestamp_ms)
    metric.tags["src_ip"] = str(src_ip)
    metric.tags["dst_ip"] = str(dst_ip)
    metric.tags["src_port"] = str(src_port)
    metric.tags["dst_port"] = str(dst_port)
    metric.tags["protocol"] = str(protocol)
    metric.tags["bytes_val"] = str(in_bytes)
    metric.tags["packets_val"] = str(in_packets)

    metric.fields["valid"] = 1

    return metric
'''

[[outputs.http]]
  url = "http://localhost:8123/?query=INSERT+INTO+flows+FORMAT+JSONEachRow&input_format_skip_unknown_fields=1"
  data_format = "template"
  template = '''
{"timestamp": {{ .Tags.timestamp }}, "src_ip": "{{ .Tags.src_ip }}", "dst_ip": "{{ .Tags.dst_ip }}", "src_port": {{ .Tags.src_port }}, "dst_port": {{ .Tags.dst_port }}, "protocol": {{ .Tags.protocol }}, "bytes": {{ .Tags.bytes_val }}, "packets": {{ .Tags.packets_val }}}
'''
  [outputs.http.headers]
    Content-Type = "application/json"
    X-ClickHouse-User = "default"

