[sources.netflow_in]
type = "socket"
address = "0.0.0.0:2055"
mode = "udp"
decoding.codec = "netflow"

[transforms.normalize_flow]
type = "remap"
inputs = ["netflow_in"]
source = '''
  # Add timestamp and parse common fields across versions
  .timestamp = now()
  
  # Ensure protocol is an integer, default to 0 if not present
  .protocol = to_int(.protocol) ?? 0
  
  # Coerce IPs to string
  .src_ip = to_string(.source_ipv4_address) ?? to_string(.source_ipv6_address) ?? "0.0.0.0"
  .dst_ip = to_string(.destination_ipv4_address) ?? to_string(.destination_ipv6_address) ?? "0.0.0.0"
  
  # Extract ports
  .src_port = to_int(.source_transport_port) ?? 0
  .dst_port = to_int(.destination_transport_port) ?? 0
  
  # Metrics
  .bytes = to_int(.octet_delta_count) ?? 0
  .packets = to_int(.packet_delta_count) ?? 0
  
  # Keep only the fields we care about
  . = {
    "timestamp": .timestamp,
    "src_ip": .src_ip,
    "dst_ip": .dst_ip,
    "src_port": .src_port,
    "dst_port": .dst_port,
    "protocol": .protocol,
    "bytes": .bytes,
    "packets": .packets
  }
'''

[sinks.clickhouse_out]
type = "clickhouse"
inputs = ["normalize_flow"]
endpoint = "http://clickhouse:8123"
database = "default"
table = "flows"
encoding.only_fields = ["timestamp", "src_ip", "dst_ip", "src_port", "dst_port", "protocol", "bytes", "packets"]
encoding.timestamp_format = "unix"
skip_unknown_fields = true
